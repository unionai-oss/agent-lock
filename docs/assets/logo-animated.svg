<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="hlock">
  <!--
    hlock, animated: the shackle opens, the sliders search while the body shifts
    shape and color, then everything settles into the tuned state and the shackle
    snaps shut. One 6s loop. With prefers-reduced-motion it shows the locked state.
  -->
  <style>
    .shackle, .body, .bg, .knob, .fill { transform-box: fill-box; animation: 6s cubic-bezier(.45, 0, .25, 1) infinite; }
    .shackle { transform-origin: 50% 100%; animation-name: shackle; }
    .body    { animation-name: hue; }
    .bg      { transform-origin: 50% 50%; animation-name: squash; }
    .fill    { transform-origin: 0 50%; }
    .k1 { animation-name: k1; } .f1 { animation-name: f1; }
    .k2 { animation-name: k2; } .f2 { animation-name: f2; }
    .k3 { animation-name: k3; } .f3 { animation-name: f3; }

    /* open, hold while tuning, snap shut with a small bounce, stay locked */
    @keyframes shackle {
      0%, 6%    { transform: translateY(0); }
      12%, 68%  { transform: translateY(-5px); }
      74%       { transform: translateY(1.2px); }
      78%, 100% { transform: translateY(0); }
    }
    /* adapt: shift hue while searching, settle back */
    @keyframes hue {
      0%, 10%   { filter: hue-rotate(0deg); }
      66%, 100% { filter: hue-rotate(360deg); }
    }
    /* the body flexes while searching, then a small "click" when it locks */
    @keyframes squash {
      0%, 10%   { transform: scale(1, 1); }
      24%       { transform: scale(1.06, .93); }
      38%       { transform: scale(.95, 1.06); }
      52%       { transform: scale(1.03, .96); }
      66%, 74%  { transform: scale(1, 1); }
      78%       { transform: scale(1.03, .97); }
      82%, 100% { transform: scale(1, 1); }
    }
    /* each knob explores its track and lands on its tuned value; its fill follows */
    @keyframes k1 { 0%,10% {transform:translateX(0)} 24% {transform:translateX(-16px)} 38% {transform:translateX(6px)} 52% {transform:translateX(-9px)} 66%,100% {transform:translateX(0)} }
    @keyframes f1 { 0%,10% {transform:scaleX(1)} 24% {transform:scaleX(.273)} 38% {transform:scaleX(1.273)} 52% {transform:scaleX(.591)} 66%,100% {transform:scaleX(1)} }
    @keyframes k2 { 0%,10% {transform:translateX(0)} 24% {transform:translateX(20px)} 38% {transform:translateX(4px)} 52% {transform:translateX(14px)} 66%,100% {transform:translateX(0)} }
    @keyframes f2 { 0%,10% {transform:scaleX(1)} 24% {transform:scaleX(4.333)} 38% {transform:scaleX(1.667)} 52% {transform:scaleX(3.333)} 66%,100% {transform:scaleX(1)} }
    @keyframes k3 { 0%,10% {transform:translateX(0)} 24% {transform:translateX(-6px)} 38% {transform:translateX(12px)} 52% {transform:translateX(-10px)} 66%,100% {transform:translateX(0)} }
    @keyframes f3 { 0%,10% {transform:scaleX(1)} 24% {transform:scaleX(.625)} 38% {transform:scaleX(1.75)} 52% {transform:scaleX(.375)} 66%,100% {transform:scaleX(1)} }

    @media (prefers-reduced-motion: reduce) {
      .shackle, .body, .bg, .knob, .fill { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="hl-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="hl-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hl-shackle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="hl-knob" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy=".6" stdDeviation=".7" flood-color="#2e1065" flood-opacity=".35"/>
    </filter>
  </defs>
  <path class="shackle" d="M21 30V20.5a11 11 0 0 1 22 0V30" fill="none" stroke="url(#hl-shackle)" stroke-width="4.5" stroke-linecap="butt"/>
  <g class="body">
    <g class="bg">
      <rect x="10" y="27" width="44" height="31" rx="6" fill="url(#hl-body)"/>
      <rect x="10" y="27" width="44" height="31" rx="6" fill="url(#hl-gloss)"/>
    </g>
    <g fill="#fff" fill-opacity=".28">
      <rect x="17" y="34.8" width="30" height="2.4" rx="1.2"/>
      <rect x="17" y="41.8" width="30" height="2.4" rx="1.2"/>
      <rect x="17" y="48.8" width="30" height="2.4" rx="1.2"/>
    </g>
    <g fill="#fff" fill-opacity=".9">
      <rect class="fill f1" x="17" y="34.8" width="22" height="2.4" rx="1.2"/>
      <rect class="fill f2" x="17" y="41.8" width="6" height="2.4" rx="1.2"/>
      <rect class="fill f3" x="17" y="48.8" width="16" height="2.4" rx="1.2"/>
    </g>
    <g fill="#fff" filter="url(#hl-knob)">
      <circle class="knob k1" cx="39" cy="36" r="3.3"/>
      <circle class="knob k2" cx="23" cy="43" r="3.3"/>
      <circle class="knob k3" cx="33" cy="50" r="3.3"/>
    </g>
  </g>
</svg>
