name: publish-cargo

# Publishes the Rust crates (`agent-lock-core`, `agent-lock`) to crates.io.
#
# Setup (once, in Settings > Secrets and variables > Actions):
#   - `CARGO_REGISTRY_TOKEN`: a crates.io API token with "publish-new" +
#     "publish-update" scope for these crate names.
#
# Shallow-checkout keeps registry token out of git; publishing a tag that
# already exists is a no-op (crates.io rejects duplicate versions).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish-crates:
    name: cargo publish (agent-lock-core, agent-lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Dry-run agent-lock-core
        run: cargo publish --dry-run --manifest-path crates/agent-lock-core/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish agent-lock-core (dependency first)
        run: cargo publish --manifest-path crates/agent-lock-core/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Dry-run agent-lock
        run: cargo publish --dry-run --manifest-path crates/agent-lock/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish agent-lock (depends on agent-lock-core)
        run: cargo publish --manifest-path crates/agent-lock/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
