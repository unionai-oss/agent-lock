name: publish-cargo

# Publishes the Rust crates (`hpm-core`, `hpm`) to crates.io.
#
# Setup (once, in Settings > Secrets and variables > Actions):
#   - `CARGO_REGISTRY_TOKEN`: a crates.io API token with "publish-new" +
#     "publish-update" scope for these crate names.
#
# Shallow-checkout keeps registry token out of git; publishing a tag that
# already exists is a no-op (crates.io rejects duplicate versions).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish-crates:
    name: cargo publish (hpm-core, hpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Dry-run hpm-core
        run: cargo publish --dry-run --manifest-path crates/hpm-core/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish hpm-core (dependency first)
        run: cargo publish --manifest-path crates/hpm-core/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Dry-run hpm
        run: cargo publish --dry-run --manifest-path crates/hpm/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish hpm (depends on hpm-core)
        run: cargo publish --manifest-path crates/hpm/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
