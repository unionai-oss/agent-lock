[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "harness-lock"
# Read by maturin from the Cargo workspace ([workspace.package].version), the single
# source of truth. Bump it with `python scripts/set_version.py X.Y.Z`.
dynamic = ["version"]
description = "Lock your agent into place — tune your agent stack and pin it (Rust core + Python bindings)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Niels Bantilan", email = "niels.bantilan@gmail.com" }]
keywords = ["agents", "evaluation", "llm", "lockfile", "tuning", "rust", "flyte"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "rich-click>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
flyte = [
    # flyteplugins-rs registers Rust-backed tasks with a Flyte/Union backend.
    "flyteplugins-rs; python_version >= '3.10'",
]

[dependency-groups]
# `uv sync` installs `dev` by default; add `--group docs` for the docs toolchain.
dev = [
    "maturin>=1.5,<2.0",
    "pytest>=7.0",
    "ruff",
]
docs = [
    # Zensical is pre-1.0 (pin it, bump deliberately) and needs Python 3.11+.
    "zensical==0.0.71; python_version >= '3.11'",
]

[project.scripts]
hlock = "harness_lock.cli:main"
harness-lock = "harness_lock.cli:main"

[tool.maturin]
manifest-path = "crates/harness-lock-py/Cargo.toml"
module-name = "harness_lock._harness_lock"
python-source = "."

[tool.uv]
# Rebuild the Rust extension on `uv sync` / `uv run` whenever Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
