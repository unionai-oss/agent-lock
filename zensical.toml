# Documentation site for hlock, built with Zensical (https://zensical.org).
#   uv run --group docs zensical serve           # http://localhost:8000, live reload
#   uv run --group docs zensical build --clean   # -> site/
# Published to GitHub Pages by .github/workflows/docs.yml.

[project]
site_name = "hlock"
site_description = "Lock your agent into place: tune your agent stack against your own tasks, then pin the winner in a harness.lock."
site_url = "https://unionai-oss.github.io/harness-lock/"
site_author = "Union.ai"
repo_url = "https://github.com/unionai-oss/harness-lock"
repo_name = "unionai-oss/harness-lock"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Union.ai · Apache-2.0"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/installation.md",
    "getting-started/quickstart.md",
  ] },
  { "Concepts" = [
    "concepts/index.md",
    "concepts/architecture.md",
  ] },
  { "Guides" = [
    "guides/task-packs.md",
    "guides/backends.md",
    "guides/optimize.md",
    "guides/upgrade.md",
    "guides/ci.md",
  ] },
  { "Reference" = [
    "reference/cli.md",
    "reference/python-api.md",
    "reference/manifest.md",
    "reference/lockfile.md",
    "reference/environment.md",
  ] },
  { "Project" = [
    "project/development.md",
    "project/releasing.md",
    { "Design spec" = "https://github.com/unionai-oss/harness-lock/blob/main/SPEC.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-purple"
accent = "pink"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-purple"
accent = "pink"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
social = [
  { icon = "fontawesome/brands/github", link = "https://github.com/unionai-oss/harness-lock" },
  { icon = "fontawesome/brands/python", link = "https://pypi.org/project/hlock/" },
  { icon = "fontawesome/brands/rust", link = "https://crates.io/crates/hlock" },
]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
