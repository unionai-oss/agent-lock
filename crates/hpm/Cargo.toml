[package]
name = "hpm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Python bindings for harness-package-manager (hpm)."

[lib]
name = "hpm"
crate-type = ["cdylib", "rlib"]

[dependencies]
hpm-core = { path = "../hpm-core" }
pyo3 = { workspace = true }
serde_json = { workspace = true }

[features]
default = []

# Build the release extension module as the importable `hpm` package.
[package.metadata.maturin]
python-source = "."
