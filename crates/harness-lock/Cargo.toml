[package]
name = "harness-lock"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lock your agent into place: tune your agent stack and pin it to harness.lock."
readme = "../../README.md"
homepage = "https://github.com/unionai-oss/harness-lock"
documentation = "https://docs.rs/harness-lock"
keywords = ["agents", "llm", "lockfile", "evaluation", "flyte"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "harness_lock"

[dependencies]
# Exact pin: harness-lock X.Y.Z is always harness-lock-core X.Y.Z.
harness-lock-core = { path = "../harness-lock-core", version = "=0.1.1" }

[features]
default = []
# Durable, traced trial execution on a Flyte / Union backend.
flyte = ["harness-lock-core/flyte"]

[lints]
workspace = true
