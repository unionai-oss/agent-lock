[package]
name = "harness-lock"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings for harness-lock."
# Built as a Python extension module (pyo3 `extension-module`), so it isn't linkable
# from Rust. It ships as the `harness-lock` PyPI wheel; only `harness-lock-core` goes
# to crates.io.
publish = false

[lib]
name = "harness_lock"
crate-type = ["cdylib", "rlib"]

[dependencies]
harness-lock-core = { path = "../harness-lock-core", version = "0.1.0" }
pyo3 = { workspace = true }
serde_json = { workspace = true }

[features]
default = []

# Build the release extension module as the importable `harness_lock` package.
[package.metadata.maturin]
python-source = "."
