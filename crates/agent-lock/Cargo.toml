[package]
name = "agent-lock"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings for agent-lock."

[lib]
name = "agent_lock"
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-lock-core = { path = "../agent-lock-core", version = "0.1.0" }
pyo3 = { workspace = true }
serde_json = { workspace = true }

[features]
default = []

# Build the release extension module as the importable `agent_lock` package.
[package.metadata.maturin]
python-source = "."
