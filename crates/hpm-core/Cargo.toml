[package]
name = "harness-package-manager-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core library for harness-package-manager: manifest, lockfile, store, tuning."

# Code-facing crate name stays `hpm_core` so `use hpm_core::…` is unchanged
# while the published (crates.io) name is `harness-package-manager-core`.
[lib]
name = "hpm_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
# The flyte-sdk-rs backend (optional — links libpython via flyte_core/pyo3 and is
# only compiled when the `flyte` feature is enabled).
flyte = { version = "0.1", optional = true }

[features]
default = []
# Uses https://github.com/flyteorg/flyte-sdk-rs for durable, traced trial
# execution on a Flyte / Union backend.
flyte = ["dep:flyte"]
