# Runtime profile: LM Studio (lms CLI).
id = "lmstudio"
name = "LM Studio"
aliases = ["lm-studio", "lms"]
homepage = "https://lmstudio.ai"
binaries = ["lms"]
ports = [1234]
provider-names = ["lmstudio", "lm-studio"]
pull = "lms get {model} --yes"
serve = "lms server start"

[models]
layout = "publisher-repo"
dirs = ["~/.lmstudio/models", "~/.cache/lm-studio/models"]

[[install]]
method = "brew-cask"
package = "lm-studio"
[[install]]
method = "app"
path-hints = ["/LM Studio.app/", "/.lmstudio/bin/", "/.cache/lm-studio/bin/"]
command = "Download LM Studio from https://lmstudio.ai, then run: npx lmstudio install-cli"

# Models `hlock localize` may pick (LM Studio model keys). Extend with your own.
[[catalog]]
id = "openai/gpt-oss-120b"
params-b = 117
min-memory-gb = 72
tier = 3
tools = true
[[catalog]]
id = "qwen/qwen3-coder-30b"
params-b = 30
min-memory-gb = 24
tier = 3
tools = true
[[catalog]]
id = "openai/gpt-oss-20b"
params-b = 21
min-memory-gb = 16
tier = 2
tools = true
[[catalog]]
id = "qwen/qwen3-8b"
params-b = 8
min-memory-gb = 8
tier = 1
tools = true
[[catalog]]
id = "qwen/qwen3-1.7b"
params-b = 1.7
min-memory-gb = 3
tier = 1
tools = true
roles = ["small", "decision"]
