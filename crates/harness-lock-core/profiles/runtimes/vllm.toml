# Runtime profile: vLLM.
id = "vllm"
name = "vLLM"
homepage = "https://docs.vllm.ai"
binaries = ["vllm"]
version = { args = ["--version"] }
ports = [8000]
provider-names = ["vllm"]
pull = "hf download {model} --revision {revision}"
serve = "vllm serve {model} --revision {revision}"

[models]
layout = "hf-cache"
dirs = ["env:HF_HUB_CACHE", "~/.cache/huggingface/hub"]

[[install]]
method = "uv-tool"
package = "vllm"
[[install]]
method = "pip"
package = "vllm"
